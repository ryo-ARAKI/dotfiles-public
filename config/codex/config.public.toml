# Safe to publish in a gist.
# This file is the shared source of truth for non-secret, machine-independent defaults.
# Keep local paths, connector-specific IDs, and other host-specific overrides in config.private.toml.
# Do not edit config.toml directly; regenerate it through ./install.

# Shared model defaults.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "xhigh"
model_verbosity = "medium"
model_reasoning_summary = "concise"

# Shared execution defaults. These persistent settings apply the same core
# preset as Codex 0.147.0's --approve-for-me to every normal launch while the
# custom auto_review policy below remains authoritative.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "workspace"
personality = "pragmatic"
web_search = "live"
project_doc_fallback_filenames = ["CLAUDE.md", "GEMINI.md"]
tool_output_token_limit = 8000

[permissions.workspace]
description = "Workspace write with restricted network"
extends = ":workspace"

[auto_review]
policy = """
Approve actions that are necessary for the active task when their effects are bounded to the user's request and comply with applicable higher-level safety requirements.

For external writes; purchases; package or environment installation; deployments; service reloads; live-system mutation; destructive filesystem or Git actions; direct pushes; force-pushes; deletions; or history rewrites, approve only when the user has explicitly authorized the concrete action and target in the current conversation. Treat that explicit authorization as sufficient even when the action is high impact.

Deny when authorization is absent, ambiguous, stale, applies to a different target, or is narrower than the proposed effects. Also deny commands whose effects cannot be bounded to the authorized action, including unnecessarily broad or opaque compound commands. Never treat authorization as permission to disclose secrets or credentials, circumvent non-overridable policy, or affect targets outside the authorized scope.
"""

# Shared TUI defaults.
[tui]
# alternate_screen = "never"  # preserve terminal scrollback instead of fullscreen alt screen
notifications = ["agent-turn-complete", "approval-requested"]
notification_method = "auto"
notification_condition = "unfocused"
status_line = [
  "project-name",
  "git-branch",
  "task-progress",
  "model-with-reasoning",
  "fast-mode",
  "permissions",
  "approval-mode",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
]
terminal_title = [
  "project-name",
  "activity",
  "run-state",
]

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

# Shared plugin defaults.
[plugins."github@openai-curated"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

# Shared feature flags.
[features]
fast_mode = true
memories = true
goals = true

# Shared memories defaults.
[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true
min_rate_limit_remaining_percent = 35
