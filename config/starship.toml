# ~/.config/starship.toml
"$schema" = "https://starship.rs/config-schema.json"

# NOTE: Emojis with variation selectors or unstable display widths may cause prompt rendering glitches.
# Examples include ⚔️ 🏎️ 🗃️ 🗑️ ✒️
# If layout breaks, prefer colourful emojis without variation selectors.

format = """
$username$hostname$directory$git_branch$git_commit$git_state$git_metrics$git_status$julia$python${custom.python_venv}$rust$typst$conda$direnv
$character"""
right_format = """$memory_usage$cmd_duration$battery$time"""

# Switch palettes here: ocean_workshop | amber_console | cool_minimal
palette = "amber_console"

[palettes.ocean_workshop]
directory = "cyan"
git_branch = "blue"
git_state = "red"
runtime = "green"
warning = "yellow"
muted = "bright-black"
accent = "bright-white"
added = "green"
deleted = "red"

[palettes.amber_console]
directory = "yellow"
git_branch = "cyan"
git_state = "red"
runtime = "yellow"
warning = "208"
muted = "bright-black"
accent = "white"
added = "green"
deleted = "red"

[palettes.cool_minimal]
directory = "white"
git_branch = "cyan"
git_state = "red"
runtime = "green"
warning = "yellow"
muted = "bright-black"
accent = "bright-white"
added = "green"
deleted = "red"

[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "⚡"

[[battery.display]]
threshold = 30
style = "bold git_state"

[character]
error_symbol = "[✖](bold red) "

[cmd_duration]
min_time = 10_000                    # Show command duration over 10,000 milliseconds (=10 sec)
format = " took [$duration]($style)"
style = "bold warning"

[conda]
format = '[$symbol$environment](dimmed green) '

[directory]
format = "[$path]($style)[$lock_symbol]($lock_style)"
style = "bold directory"

[directory.substitutions]
Documents = "doc"
Downloads = "dl"
github = "gh"
Simulation = "sim"
".config" = ".cfg"

[direnv]
disabled = false
format = "[$symbol$loaded]($style) "
symbol = "env "
style = "muted"

[git_branch]
format = " on [$symbol$branch]($style) "
symbol = "🍣 "
style = "bold git_branch"

[git_commit]
commit_hash_length = 8
style = "bold accent"

[git_state]
format = '[\[$state( $progress_current/$progress_total)\]]($style) '
style = "bold git_state"

[git_metrics]
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "bold added"
deleted_style = "bold deleted"
only_nonzero_diffs = true

[git_status]
conflicted = "🥊 "
ahead = "🚗 ×${count} "
behind = "🐢 ×${count} "
diverged = "🔱 🚗 ×${ahead_count} 🐢 ×${behind_count} "
untracked = "📭 ×${count} "
stashed = "📦 ×${count} "
modified = "📝 ×${count} "
staged = "📚 ×${count} "
renamed = "📛 ×${count} "
deleted = "🚮 ×${count} "
style = "bright-white"
format = "$all_status$ahead_behind"

[hostname]
ssh_only = true
format = "[$hostname]($style)"
trim_at = "-"
style = "bold muted"
disabled = false

[julia]
format = "[$symbol$version]($style) "
symbol = "ஃ "
style = "bold runtime"

[memory_usage]
format = "$symbol[${ram}( | ${swap})]($style) "
threshold = 70
style = "bold muted"
disabled = false

[package]
disabled = true

[python]
format = "[${symbol}${pyenv_prefix}(${version} )]($style) "
style = "bold runtime"
detect_env_vars = []
python_binary = "python3"

[custom.python_venv]
command = '''
venv="$VIRTUAL_ENV"
base="$(basename "$venv")"
if [ "$base" = ".venv" ] || [ "$base" = "venv" ] || [ "$base" = "env" ]; then
  basename "$(dirname "$venv")"
else
  printf '%s\n' "$base"
fi
'''
when = 'test -n "$VIRTUAL_ENV"'
format = '[(\($output\) )]($style)'
style = "bold runtime"
shell = ["bash", "--noprofile", "--norc"]

[rust]
format = "[$symbol$version]($style) "
style = "bold runtime"

[time]
time_format = "%R"
format = "🕙 $time($style) "
style = "accent"
disabled = false

[typst]
format = "[$symbol($version)]($style)"
symbol = "📘 "
style = "bold #239dae"

[username]
style_user = "bold dimmed blue"
show_always = false

[nodejs]
format = "via [🤖 $version](bold green) "
disabled = true
